<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101612" />
    <meta name="description" content="Sinthos is taking shape. Our new home is coming soon." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sinthos — Coming soon" />
    <meta property="og:description" content="Something new is taking shape at Sinthos." />
    <meta property="og:image" content="assets/preview.svg" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sinthos — Coming soon</title>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header" aria-label="Site header">
        <a class="brand" href="./" aria-label="Sinthos home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>SINTHOS</span>
        </a>
        <span class="header-note"><span class="status-dot" aria-hidden="true"></span> A new chapter is loading</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <p class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span> INTRODUCING SINTHOS</p>
            <h1 id="hero-title">Something good<br />is <em>taking shape.</em></h1>
            <p class="hero-description">We’re building our new home. Check back soon to see what’s next.</p>
            <div class="hero-footer">
              <span class="small-rule" aria-hidden="true"></span>
              <span>STAY CURIOUS <span aria-hidden="true">↗</span></span>
            </div>
          </div>

          <div class="artwork" aria-hidden="true">
            <div class="artwork-glow"></div>
            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="orbit orbit-three"></div>
            <div class="core">
              <div class="core-inner"></div>
            </div>
            <span class="art-label art-label-top">01 / BEGINNING</span>
            <span class="art-label art-label-bottom">IN MOTION · 2026</span>
            <span class="art-cross art-cross-one">+</span>
            <span class="art-cross art-cross-two">+</span>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>© <span id="year">2026</span> SINTHOS</span>
        <span>MADE FOR WHAT’S NEXT.</span>
      </footer>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
